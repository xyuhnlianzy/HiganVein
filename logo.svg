<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Top Half: Crimson Red Spider Lily & Kakugan -->
    <linearGradient id="topCrimson" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Bottom Half: Violet Witch / Magic Glow -->
    <linearGradient id="bottomViolet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>

    <!-- White Hair Monogram Gradient -->
    <linearGradient id="whiteHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d4d4d8" />
    </linearGradient>

    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="80%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <filter id="epicGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="500" height="500" rx="110" fill="#09090b" stroke="#27272a" stroke-width="4" />

  <!-- Vertical Split-Screen Mirror Background -->
  <path d="M4,114 Q4,4 114,4 L386,4 Q496,4 496,114 L496,250 L4,250 Z" fill="url(#topCrimson)" opacity="0.35" />
  <path d="M4,250 L496,250 L496,386 Q496,496 386,496 L114,496 Q4,496 4,386 Z" fill="url(#bottomViolet)" opacity="0.35" />

  <!-- Red Spider Lily Silhouettes Top & Violet Wisteria Bottom -->
  <g fill="#ef4444" opacity="0.5" filter="url(#epicGlow)">
    <path d="M80,0 Q120,50 160,20 Q200,60 250,25 Q300,60 340,20 Q380,50 420,0 Z" />
  </g>
  <g fill="#a855f7" opacity="0.5" filter="url(#epicGlow)">
    <path d="M80,500 Q120,450 160,480 Q200,440 250,475 Q300,440 340,480 Q380,450 420,500 Z" />
  </g>

  <!-- Center Horizon Divider Line -->
  <line x1="80" y1="250" x2="420" y2="250" stroke="#ffffff" stroke-width="2" opacity="0.6" filter="url(#epicGlow)" />

  <!-- The Signature "N" Monogram in the Center -->
  <g transform="translate(250, 250)" filter="url(#epicGlow)">
    <!-- N Letterform: White hair aesthetic -->
    <path d="M-75,95 L-75,-95 L-35,-95 L35,50 L35,-95 L75,-95 L75,95 L35,95 L-35,-50 L-35,95 Z" fill="url(#whiteHair)" stroke="#09090b" stroke-width="5" stroke-linejoin="round" />
    
    <!-- Shadow depth on N -->
    <path d="M-35,-50 L35,50 L35,95 L-35,95 Z" fill="#71717a" opacity="0.35" />

    <!-- Central Glowing Kakugan / Portal Eye on N -->
    <circle cx="20" cy="-20" r="18" fill="url(#portalGlow)" />
    <ellipse cx="20" cy="-20" rx="5" ry="12" fill="#000000" />
    <circle cx="20" cy="-20" r="2" fill="#ffffff" />
  </g>
</svg>
