<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lycoris</title>
    <style>
        :root {
            --bg-color: #0c0c0e;
            --accent-red: #ef4444;
            --accent-glow: rgba(239, 68, 68, 0.15);
            --text-main: #f4f4f6;
            --text-muted: #71717a;
            --card-border: #1e1e24;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Plus Jakarta Sans", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            user-select: none;
            overflow: hidden;
            background-image: 
                radial-gradient(circle 600px at 50% 35%, rgba(239, 68, 68, 0.08), transparent 70%),
                radial-gradient(circle 300px at 20% 80%, rgba(185, 28, 28, 0.04), transparent 60%);
        }

        .flower-emblem {
            width: 84px;
            height: 84px;
            margin-bottom: 24px;
            filter: drop-shadow(0 0 25px rgba(239, 68, 68, 0.35));
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s;
        }
        .flower-emblem:hover {
            transform: scale(1.08) rotate(5deg);
            filter: drop-shadow(0 0 35px rgba(239, 68, 68, 0.6));
        }

        .title-block {
            text-align: center;
            margin-bottom: 32px;
        }
        .title-text {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
        }
        .title-text span {
            color: var(--accent-red);
        }
        .motto {
            font-size: 11px;
            font-family: "JetBrains Mono", monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .search-wrap {
            width: 100%;
            max-width: 580px;
            position: relative;
            margin-bottom: 40px;
        }
        .search-box {
            width: 100%;
            height: 50px;
            background: #141419;
            border: 1px solid #272730;
            border-radius: 25px;
            padding: 0 24px 0 50px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            transition: all 0.25s ease;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }
        .search-box:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2), 0 10px 35px rgba(0, 0, 0, 0.6);
            background: #181820;
        }
        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
            pointer-events: none;
        }

        .identity-bar {
            display: flex;
            align-items: center;
            gap: 24px;
            font-size: 11px;
            font-family: "JetBrains Mono", monospace;
            color: #52525b;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 24px;
            margin-top: 20px;
        }
        .identity-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent-red);
            box-shadow: 0 0 8px var(--accent-red);
        }
        .badge-arch {
            color: #a1a1aa;
        }
    </style>
</head>
<body>
    <!-- Red Spider Lily (Higanbana / Lycoris Radiata Emblem) -->
    <svg class="flower-emblem" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="84" height="84">
        <defs>
            <radialGradient id="lycoris-core-glow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4"/>
                <stop offset="100%" stop-color="#0c0c0e" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="spider-petal" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#fca5a5"/>
                <stop offset="40%" stop-color="#ef4444"/>
                <stop offset="100%" stop-color="#991b1b"/>
            </linearGradient>
        </defs>
        <circle cx="64" cy="64" r="56" fill="url(#lycoris-core-glow)"/>
        <g transform="translate(64, 68)">
            <!-- Pistil -->
            <circle cx="0" cy="-6" r="4.5" fill="#f87171"/>
            <!-- Filaments & Anthers -->
            <path d="M 0 -6 Q -15 -35 -40 -40 Q -35 -30 -10 -15" fill="none" stroke="url(#spider-petal)" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="-40" cy="-40" r="2.5" fill="#fca5a5"/>
            <path d="M 0 -6 Q -25 -20 -48 -15 Q -38 -10 -12 -5" fill="none" stroke="url(#spider-petal)" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="-48" cy="-15" r="2.5" fill="#fca5a5"/>
            <path d="M 0 -6 Q -10 -45 -18 -55 Q -10 -40 -4 -18" fill="none" stroke="url(#spider-petal)" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="-18" cy="-55" r="2.5" fill="#fca5a5"/>
            <path d="M 0 -6 Q 10 -45 18 -55 Q 10 -40 4 -18" fill="none" stroke="url(#spider-petal)" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="18" cy="-55" r="2.5" fill="#fca5a5"/>
            <path d="M 0 -6 Q 15 -35 40 -40 Q 35 -30 10 -15" fill="none" stroke="url(#spider-petal)" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="40" cy="-40" r="2.5" fill="#fca5a5"/>
            <path d="M 0 -6 Q 25 -20 48 -15 Q 38 -10 12 -5" fill="none" stroke="url(#spider-petal)" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="48" cy="-15" r="2.5" fill="#fca5a5"/>
            <!-- Lower Petals & Stem -->
            <path d="M 0 -6 Q -8 15 -14 26 Q -4 18 0 0" fill="url(#spider-petal)"/>
            <path d="M 0 -6 Q 8 15 14 26 Q 4 18 0 0" fill="url(#spider-petal)"/>
            <path d="M 0 0 L 0 35" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
        </g>
    </svg>

    <div class="title-block">
        <h1 class="title-text">Lycoris <span>Browser</span></h1>
        <div class="motto">HiganveinOS Sovereign Web Platform</div>
    </div>

    <form class="search-wrap" action="https://www.google.com/search" method="GET">
        <span class="search-icon">🔍</span>
        <input type="text" name="q" class="search-box" placeholder="Search the web with zero telemetry or enter URL..." autofocus autocomplete="off">
        <input type="hidden" name="udm" value="14">
    </form>

    <div class="identity-bar">
        <div class="identity-item">
            <span class="dot"></span>
            <span>HIGANVEINOS PROTOCOL</span>
        </div>
        <div class="identity-item badge-arch">
            <span>QUAD-CORE: C · C++ · RUST · ZIG</span>
        </div>
        <div class="identity-item">
            <span>PURE WEB (UDM=14)</span>
        </div>
    </div>
</body>
</html>
