LABEL arch_gui
MENU LABEL HiganveinOS Live GUI (BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
APPEND archisobasedir=arch archisolabel=HIGANVEINOS_202609 quiet splash higan.mode=gui

LABEL arch_cli
MENU LABEL HiganveinOS Live CLI (Pure Console)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
APPEND archisobasedir=arch archisolabel=HIGANVEINOS_202609 systemd.unit=multi-user.target quiet higan.mode=cli
