<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Top Half: Crimson Red Spider Lily & Kakugan -->
    <linearGradient id="topCrimson" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Bottom Half: Violet Witch / Magic Glow -->
    <linearGradient id="bottomViolet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>

    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ec4899" />
      <stop offset="80%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <filter id="epicGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="500" height="500" rx="110" fill="#09090b" stroke="#27272a" stroke-width="4" />

  <!-- Vertical Split-Screen Mirror Background -->
  <g clip-path="url(#roundedBox)">
    <!-- Top Half (Crimson) -->
    <path d="M0,0 L500,0 L500,250 L0,250 Z" fill="url(#topCrimson)" opacity="0.3" />
    <!-- Bottom Half (Violet) -->
    <path d="M0,250 L500,250 L500,500 L0,500 Z" fill="url(#bottomViolet)" opacity="0.3" />
  </g>

  <!-- Red Spider Lily Silhouettes (Top & Bottom framing) -->
  <g fill="#ef4444" opacity="0.6" filter="url(#epicGlow)">
    <path d="M50,0 Q80,60 120,30 Q160,80 200,40 Q250,70 300,40 Q350,80 400,30 Q440,60 450,0 Z" />
  </g>
  <g fill="#a855f7" opacity="0.6" filter="url(#epicGlow)">
    <path d="M50,500 Q80,440 120,470 Q160,420 200,460 Q250,430 300,460 Q350,420 400,470 Q440,440 450,500 Z" />
  </g>

  <!-- Central Bridge / Glowing Portal Eye (Bridging the split halves) -->
  <g transform="translate(250, 250)" filter="url(#epicGlow)">
    <!-- Outer Portal Ring -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="#f43f5e" stroke-width="4" stroke-dasharray="10 5" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="#a855f7" stroke-width="4" stroke-dasharray="8 8" />

    <!-- Central Glowing Eye Core -->
    <circle cx="0" cy="0" r="50" fill="url(#portalGlow)" />
    <ellipse cx="0" cy="0" rx="15" ry="35" fill="#000000" />
    <ellipse cx="0" cy="0" rx="6" ry="20" fill="#ffffff" />
  </g>

  <!-- Center Horizon Divider Line -->
  <line x1="100" y1="250" x2="400" y2="250" stroke="#ffffff" stroke-width="3" opacity="0.8" filter="url(#epicGlow)" />
</svg>
