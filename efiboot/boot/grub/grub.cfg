set gfxmode=auto
set gfxpayload=keep
insmod all_video
insmod png
insmod jpeg
insmod font
insmod gfxterm
insmod gfxmenu

if loadfont /boot/grub/themes/higan/dejavu_14.pf2 ; then
    set gfxmode="auto"
    terminal_output gfxterm
fi

set theme=/boot/grub/themes/higan/theme.txt
export theme
background_image /boot/grub/themes/higan/background.jpg

set menu_color_normal=light-gray/black
set menu_color_highlight=white/red

menuentry "HiganveinOS Live (UEFI / CachyOS Kernel)" {
    set gfxpayload=keep
    search --no-floppy --set=root --label HIGANVEINOS_*
    linux /arch/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=arch archisolabel=$root_label quiet splash
    initrd /arch/boot/x86_64/initramfs-linux-cachyos.img
}

menuentry "HiganveinOS Live (Safe Graphics / Nomodeset)" {
    set gfxpayload=keep
    search --no-floppy --set=root --label HIGANVEINOS_*
    linux /arch/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=arch archisolabel=$root_label nomodeset
    initrd /arch/boot/x86_64/initramfs-linux-cachyos.img
}

menuentry "UEFI Firmware Settings" {
    fwsetup
}

menuentry "Reboot System" {
    reboot
}

menuentry "Power Off" {
    halt
}
