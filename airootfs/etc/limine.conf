# Limine Bootloader - HiganveinOS Frieren Theme
timeout: 5
interface_resolution: 1920x1080
interface_branding: 
interface_help_hidden: yes
default_entry: 1
wallpaper: boot():/limine-wallpaper.jpg
wallpaper_style: stretched
term_background: 00000000
term_foreground: fafafa
term_margin: 0
term_margin_gradient: 0

/HiganveinOS (Default)
    protocol: linux
    kernel_path: boot():/vmlinuz-linux-cachyos
    kernel_cmdline: root=UUID=@ROOT_UUID@ rw quiet loglevel=3 splash
    module_path: boot():/initramfs-linux-cachyos.img

/HiganveinOS (Fallback Initramfs)
    protocol: linux
    kernel_path: boot():/vmlinuz-linux-cachyos
    kernel_cmdline: root=UUID=@ROOT_UUID@ rw
    module_path: boot():/initramfs-linux-cachyos-fallback.img
