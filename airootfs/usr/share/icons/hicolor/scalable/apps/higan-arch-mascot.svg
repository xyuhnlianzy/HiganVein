<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Canvas Void -->
    <radialGradient id="voidBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="70%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#020204"/>
    </radialGradient>

    <!-- Higan Crimson Shading -->
    <linearGradient id="archBody" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ff5757"/>
      <stop offset="45%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Left Wing Shadow Accent -->
    <linearGradient id="wingShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>

    <!-- Glowing Orbit Ring Gradient -->
    <linearGradient id="orbitGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Background Round Canvas -->
  <rect width="512" height="512" rx="105" fill="url(#voidBg)"/>
  <rect width="498" height="498" x="7" y="7" rx="98" fill="none" stroke="#27272a" stroke-width="2"/>

  <!-- 2. Orbit Ring Back Segment (Passes Behind Left Arch Flank) -->
  <path d="M 50 310 C 65 240, 180 180, 340 180" 
        fill="none" 
        stroke="#ef4444" 
        stroke-width="12" 
        stroke-linecap="round" 
        opacity="0.3"/>

  <!-- 3. Twin Torii Orb Stems (ASCII: O |) -->
  <!-- Left Torii Stem -->
  <path d="M 120 230 L 70 160" stroke="#7f1d1d" stroke-width="14" stroke-linecap="round"/>
  <path d="M 120 230 L 70 160" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
  <circle cx="70" cy="160" r="16" fill="#ffffff" stroke="#7f1d1d" stroke-width="5"/>
  <circle cx="70" cy="160" r="7" fill="#ef4444"/>

  <!-- Right Torii Stem -->
  <path d="M 392 230 L 442 160" stroke="#7f1d1d" stroke-width="14" stroke-linecap="round"/>
  <path d="M 392 230 L 442 160" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
  <circle cx="442" cy="160" r="16" fill="#ffffff" stroke="#7f1d1d" stroke-width="5"/>
  <circle cx="442" cy="160" r="7" fill="#ef4444"/>

  <!-- 4. Pure Arch Linux Swoop & Silhouette Combined with Chibi Mascot -->
  <!-- The Outer Contour of Arch Linux: Apex -> Sweeping Flanks -> Base Cutout -->
  <!-- Bold Dark Outer Stroke for Silhouette Punch -->
  <path d="M 256 55
           C 275 110, 335 220, 395 320
           C 425 370, 442 410, 440 435
           C 438 448, 420 445, 390 430
           C 350 410, 320 380, 290 310
           C 275 275, 270 270, 256 270
           C 242 270, 237 275, 222 310
           C 192 380, 162 410, 122 430
           C 92 445, 74 448, 72 435
           C 70 410, 87 370, 117 320
           C 177 220, 237 110, 256 55 Z"
        fill="#7f1d1d" 
        stroke="#450a0a" 
        stroke-width="16" 
        stroke-linejoin="round"/>

  <!-- The Vibrant Arch Chibi Body -->
  <path d="M 256 55
           C 275 110, 335 220, 395 320
           C 425 370, 442 410, 440 435
           C 438 448, 420 445, 390 430
           C 350 410, 320 380, 290 310
           C 275 275, 270 270, 256 270
           C 242 270, 237 275, 222 310
           C 192 380, 162 410, 122 430
           C 92 445, 74 448, 72 435
           C 70 410, 87 370, 117 320
           C 177 220, 237 110, 256 55 Z"
        fill="url(#archBody)"/>

  <!-- Arch Linux Signature Interior Triangular Core Shading (Right Wing Facet) -->
  <path d="M 256 55 
           C 256 160, 256 270, 256 270 
           C 270 270, 275 275, 290 310 
           C 320 380, 350 410, 390 430
           C 420 445, 438 448, 440 435
           C 442 410, 425 370, 395 320
           C 335 220, 275 110, 256 55 Z" 
        fill="#ff7373" 
        opacity="0.22"/>

  <!-- Left Wing Deep Shading -->
  <path d="M 256 55 
           C 256 160, 256 270, 256 270 
           C 242 270, 237 275, 222 310 
           C 192 380, 162 410, 122 430
           C 92 445, 74 448, 72 435
           C 70 410, 87 370, 117 320
           C 177 220, 237 110, 256 55 Z" 
        fill="url(#wingShadow)" 
        opacity="0.35"/>

  <!-- Arch Center Heart Gap / Void Ingress -->
  <path d="M 256 270 C 238 270, 215 320, 180 395 C 215 385, 240 375, 256 375 C 272 375, 297 385, 332 395 C 297 320, 274 270, 256 270 Z" 
        fill="#09090b" 
        stroke="#450a0a" 
        stroke-width="5"/>

  <!-- 5. Mascot Expression (> w <) Rooted in the Arch Apex -->
  <!-- Left Winking Eye: > -->
  <path d="M 200 185 L 224 198 L 200 211" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="8.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#softGlow)"/>

  <!-- Right Winking Eye: < -->
  <path d="M 312 185 L 288 198 L 312 211" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="8.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#softGlow)"/>

  <!-- Cute Nose / Mouth -->
  <ellipse cx="256" cy="216" rx="5" ry="6" fill="#ffffff"/>
  <path d="M 246 228 Q 256 238 266 228" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="5" 
        stroke-linecap="round"/>

  <!-- Cheerful Anime Blush -->
  <ellipse cx="178" cy="216" rx="14" ry="7" fill="#ffffff" opacity="0.45"/>
  <ellipse cx="334" cy="216" rx="14" ry="7" fill="#ffffff" opacity="0.45"/>

  <!-- 6. Planetary Orbit Ring Front (Wrapping across the Arch Belly) -->
  <path d="M 45 325 C 95 425, 415 400, 475 275" 
        fill="none" 
        stroke="url(#orbitGlow)" 
        stroke-width="15" 
        stroke-linecap="round"/>
  <!-- Specular Streak on the Ring -->
  <path d="M 160 375 C 235 405, 360 395, 415 340" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="5.5" 
        stroke-linecap="round"/>

  <!-- Cosmic Star Twinkle -->
  <path d="M 445 235 Q 460 235 460 220 Q 460 235 475 235 Q 460 235 460 250 Q 460 235 445 235 Z" fill="#ffffff"/>
</svg>
