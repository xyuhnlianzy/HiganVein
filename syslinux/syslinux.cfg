SERIAL 0 38400
UI vesamenu.c32
DEFAULT higan
PROMPT 0
TIMEOUT 50
F1 cboot.msg
F2 f2.txt
F3 f3.txt
F4 f4.txt
F5 f5.txt
F6 f6.txt
F7 f7.txt
F8 f8.txt
F9 f9.txt
F10 f10.txt
F11 f11.txt
F12 f12.txt

MENU BACKGROUND splash.png
MENU TITLE HiganveinOS Core v1.0 (Legacy BIOS)
MENU COLOR border      30/44    #40ffffffff #a0000000 std
MENU COLOR title       1;36/44  #ef4444ff #a0000000 std
MENU COLOR sel         7/37     #ffffffff #991b1bff std
MENU COLOR unsel       37/44    #d4d4d8ff #00000000 std
MENU COLOR help        37/44    #9ca3af00 #00000000 std
MENU COLOR timeout_msg 37/44    #d4d4d8ff #00000000 std
MENU COLOR timeout     1;37/44  #ef4444ff #00000000 std
MENU COLOR msg07       37/44    #d4d4d8ff #00000000 std
MENU COLOR tabmsg      31/44    #ef4444ff #00000000 std

LABEL higan
    MENU LABEL HiganveinOS Live (Legacy BIOS)
    LINUX /arch/boot/x86_64/vmlinuz-linux-cachyos
    INITRD /arch/boot/x86_64/initramfs-linux-cachyos.img
    APPEND archisobasedir=arch archisolabel=HIGANVEINOS_202609 quiet splash

LABEL higan-safe
    MENU LABEL HiganveinOS Live (Safe Graphics / Nomodeset)
    LINUX /arch/boot/x86_64/vmlinuz-linux-cachyos
    INITRD /arch/boot/x86_64/initramfs-linux-cachyos.img
    APPEND archisobasedir=arch archisolabel=HIGANVEINOS_202609 nomodeset

LABEL hdt
    MENU LABEL Hardware Detection Tool (HDT)
    COM32 hdt.c32

LABEL reboot
    MENU LABEL Reboot
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL Power Off
    COM32 poweroff.c32
