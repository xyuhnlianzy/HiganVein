<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="500" height="500" rx="100" fill="#0f172a" />
  <g transform="translate(250, 250)">
    <!-- Outer Hexagon / Shield -->
    <polygon points="0,-160 138,-80 138,80 0,160 -138,80 -138,-80" fill="none" stroke="url(#grad)" stroke-width="12" stroke-linejoin="round" filter="url(#glow)" />
    <!-- Inner N Monogram -->
    <path d="M-60,70 L-60,-70 L-15,-70 L35,35 L35,-70 L75,-70 L75,70 L30,70 L-20,-35 L-20,70 Z" fill="url(#grad)" />
  </g>
</svg>
