# HiganveinOS Kitty Configuration
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window padding
window_padding_width 12

# Clipboard and Keybindings (Copy & Paste standard)
map ctrl+c copy_to_clipboard
map ctrl+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Mouse copy on select
copy_on_select yes

# Background and foreground
background #09090b
foreground #f4f4f5
selection_background #ef4444
selection_foreground #ffffff
cursor #ef4444
cursor_text_color #09090b

# Colors
# Black
color0 #18181b
color8 #52525b
# Red
color1 #ef4444
color9 #f87171
# Green
color2 #22c55e
color10 #4ade80
# Yellow
color3 #eab308
color11 #facc15
# Blue
color4 #3b82f6
color12 #60a5fa
# Magenta
color5 #a855f7
color13 #c084fc
# Cyan
color6 #06b6d4
color14 #22d3ee
# White
color7 #e4e4e7
color15 #ffffff
