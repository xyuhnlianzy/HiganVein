<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Kaneki/Frieren Dual-Tone Mana Gradient -->
    <linearGradient id="kanekiMana" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    
    <!-- Dark Monochrome Depth (Kaneki Vibe) -->
    <radialGradient id="monoDepth" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Monochrome Background -->
  <rect width="500" height="500" rx="110" fill="url(#monoDepth)" stroke="#334155" stroke-width="4" />

  <!-- Dramatic Framing Lines (Kaneki Shading / Speed Vibe) -->
  <g stroke="#334155" stroke-width="2" opacity="0.4">
    <line x1="100" y1="100" x2="400" y2="400" />
    <line x1="400" y1="100" x2="100" y2="400" />
    <circle cx="250" cy="250" r="160" fill="none" stroke-dasharray="6 12" />
  </g>

  <!-- Central Grimoire / Core (Frieren Tome + Kaneki Focus) -->
  <g transform="translate(250, 250)" filter="url(#intenseGlow)">
    <!-- Grimoire Open Pages (Wings / Arch Chevron Silhouette) -->
    <path d="M-130,-60 L-30,-110 L0,-30 L30,-110 L130,-60 L90,110 L-90,110 Z" fill="#0b0f19" stroke="url(#kanekiMana)" stroke-width="6" stroke-linejoin="round" />
    
    <!-- Central Spine & Split -->
    <line x1="0" y1="-120" x2="0" y2="120" stroke="url(#kanekiMana)" stroke-width="6" />

    <!-- Floating Magical Core / Eye (Kaneki mask & Frieren mana fusion) -->
    <circle cx="0" cy="15" r="40" fill="#090d16" stroke="url(#kanekiMana)" stroke-width="6" />
    <circle cx="0" cy="15" r="16" fill="#38bdf8" />
    <circle cx="0" cy="15" r="6" fill="#ffffff" />

    <!-- Floating Runes / Focus Lines -->
    <path d="M-80,-20 L-50,-20 M50,-20 L80,-20 M-60,30 L-40,30 M40,30 L60,30" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
