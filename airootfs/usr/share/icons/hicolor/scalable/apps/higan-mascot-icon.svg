<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="75%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#020204"/>
    </radialGradient>

    <!-- Crimson Mascot Shading -->
    <linearGradient id="bodyGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Dark Underbelly Shading -->
    <linearGradient id="innerLegGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>

    <!-- Planetary Orbit Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="94" fill="none" stroke="#27272a" stroke-width="2.5"/>

  <!-- 2. Orbit Ring Back Segment (Passes Behind Left Body) -->
  <path d="M 60 305 C 50 250, 150 190, 310 185" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round" opacity="0.35"/>

  <!-- 3. Twin Side Stems / Torii Whisker Antennas (Identity from higan-logo.txt: O |) -->
  <!-- Left Side Antenna -->
  <path d="M 120 220 L 75 160" stroke="#7f1d1d" stroke-width="14" stroke-linecap="round"/>
  <path d="M 120 220 L 75 160" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
  <circle cx="75" cy="160" r="16" fill="#ffffff" stroke="#7f1d1d" stroke-width="5"/>
  <circle cx="75" cy="160" r="7" fill="#ef4444"/>

  <!-- Right Side Antenna -->
  <path d="M 392 220 L 437 160" stroke="#7f1d1d" stroke-width="14" stroke-linecap="round"/>
  <path d="M 392 220 L 437 160" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
  <circle cx="437" cy="160" r="16" fill="#ffffff" stroke="#7f1d1d" stroke-width="5"/>
  <circle cx="437" cy="160" r="7" fill="#ef4444"/>

  <!-- 4. Mascot Main Silhouette (Arch Chevron Apex + Star Chibi Stance) -->
  <!-- Dark Contour Outline -->
  <path d="M 256 64 
           L 326 182 
           L 418 250 
           L 364 330 
           L 396 440 
           L 292 410 
           L 256 310 
           L 220 410 
           L 116 440 
           L 148 330 
           L 94 250 
           L 186 182 Z"
        fill="#7f1d1d" 
        stroke="#450a0a" 
        stroke-width="16" 
        stroke-linejoin="round"/>

  <!-- Colored Mascot Body Fill -->
  <path d="M 256 64 
           L 326 182 
           L 418 250 
           L 364 330 
           L 396 440 
           L 292 410 
           L 256 310 
           L 220 410 
           L 116 440 
           L 148 330 
           L 94 250 
           L 186 182 Z"
        fill="url(#bodyGrad)"/>

  <!-- Inner Leg Dark Hollow Gap (Arch Linux A-Silhouette cutout: // \\) -->
  <path d="M 256 310 L 292 410 L 220 410 Z" fill="url(#innerLegGrad)"/>

  <!-- Ear / Crest Facets (Origami / Chibi Cuts) -->
  <path d="M 256 64 L 256 195 L 186 182 Z" fill="#ff7878" opacity="0.4"/>
  <path d="M 256 64 L 256 195 L 326 182 Z" fill="#b91c1c" opacity="0.3"/>
  <path d="M 94 250 L 175 240 L 148 330 Z" fill="#b91c1c" opacity="0.4"/>
  <path d="M 418 250 L 337 240 L 364 330 Z" fill="#ff7878" opacity="0.3"/>

  <!-- 5. Cute Facial Expression (> w <) -->
  <!-- Left Eye (Chibi Wink: > ) -->
  <path d="M 198 220 L 222 232 L 198 244" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Right Eye (Chibi Wink: < ) -->
  <path d="M 314 220 L 290 232 L 314 244" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Cute Dot Mouth / Nose -->
  <ellipse cx="256" cy="254" rx="6" ry="7" fill="#ffffff"/>
  <path d="M 248 266 Q 256 274 264 266" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

  <!-- Blushing Chibi Cheeks -->
  <ellipse cx="178" cy="252" rx="14" ry="7" fill="#ffffff" opacity="0.45"/>
  <ellipse cx="334" cy="252" rx="14" ry="7" fill="#ffffff" opacity="0.45"/>

  <!-- 6. Orbit Planetary Ring Front Segment (Passes Across Midsection in 3D) -->
  <path d="M 50 326 C 90 410, 420 380, 475 270" 
        fill="none" 
        stroke="url(#ringGrad)" 
        stroke-width="14" 
        stroke-linecap="round"/>
  <!-- Ring Shimmer Highlight -->
  <path d="M 170 366 C 240 388, 350 375, 410 330" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="5" 
        stroke-linecap="round"/>

  <!-- Sparkling Star Accent -->
  <path d="M 440 230 Q 455 230 455 215 Q 455 230 470 230 Q 455 230 455 245 Q 455 230 440 230 Z" fill="#ffffff"/>
</svg>
