# Limine Bootloader - HiganveinOS Tech-Noir Theme
timeout: 3
default_entry: 1
interface_resolution: 0x0
interface_help_hidden: yes

# Branding & Colors (Spider Lily Tech-Noir Palette)
interface_branding: HIGANVEIN PROTOCOL · ZERO TELEMETRY
interface_branding_colour: e11d48

# Canvas & Wallpaper
wallpaper: boot():/limine-wallpaper.jpg
wallpaper_style: stretched
backdrop: 0b070f

# Terminal Box Styling
term_background: 900b070f
term_foreground: f5e6ed
term_highlight: e11d48
term_highlight_background: 33e11d48
term_margin: 48
term_margin_gradient: 16
term_font_scale: 2x2

/HiganveinOS Flagship (CachyOS LTS)
    protocol: linux
    kernel_path: boot():/vmlinuz-linux-cachyos-lts
    kernel_cmdline: root=UUID=@ROOT_UUID@ rw loglevel=3 quiet splash
    module_path: boot():/initramfs-linux-cachyos-lts.img

/HiganveinOS Flagship (Fallback Initramfs)
    protocol: linux
    kernel_path: boot():/vmlinuz-linux-cachyos-lts
    kernel_cmdline: root=UUID=@ROOT_UUID@ rw
    module_path: boot():/initramfs-linux-cachyos-lts-fallback.img
