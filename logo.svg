<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Frieren Blue Mana Gradient -->
    <linearGradient id="manaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <!-- Magical Glow Filter -->
    <filter id="magicGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Grimoire Cover Background -->
  <rect width="500" height="500" rx="110" fill="#090d16" stroke="#1e293b" stroke-width="4" />

  <!-- Ancient Grimoire / Tome Shape -->
  <g transform="translate(250, 250)">
    <!-- Book Pages / Base -->
    <path d="M-120,-90 Q0,-120 120,-90 L120,100 Q0,130 -120,100 Z" fill="#1e293b" opacity="0.6" />
    
    <!-- Magical Floating Ancient Tome / Core -->
    <path d="M-90,-70 Q0,-95 90,-70 L90,80 Q0,105 -90,80 Z" fill="url(#bookCover)" stroke="url(#manaGrad)" stroke-width="6" filter="url(#magicGlow)" />
    
    <!-- Spine / Center binding -->
    <line x1="0" y1="-85" x2="0" y2="92" stroke="url(#manaGrad)" stroke-width="5" />

    <!-- Frieren's Magical Blue Grimoire Crest / Arch Chevron Fusion -->
    <g filter="url(#magicGlow)">
      <!-- Floating Magical Crystal / Rune Diamond -->
      <polygon points="0,-50 35,0 0,50 -35,0" fill="none" stroke="url(#manaGrad)" stroke-width="5" />
      <polygon points="0,-35 22,0 0,35 -22,0" fill="url(#manaGrad)" opacity="0.4" />
      
      <!-- Inner Mana Spark / Core -->
      <circle cx="0" cy="0" r="10" fill="#ffffff" />
      <circle cx="0" cy="0" r="22" fill="none" stroke="#60a5fa" stroke-width="3" stroke-dasharray="4 4" />
    </g>

    <!-- Ancient Magical Runes / Floating Particles -->
    <circle cx="-65" cy="-30" r="4" fill="#38bdf8" filter="url(#magicGlow)" />
    <circle cx="65" cy="-30" r="4" fill="#38bdf8" filter="url(#magicGlow)" />
    <circle cx="-50" cy="40" r="3" fill="#60a5fa" filter="url(#magicGlow)" />
    <circle cx="50" cy="40" r="3" fill="#60a5fa" filter="url(#magicGlow)" />
  </g>
</svg>
