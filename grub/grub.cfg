# HiganveinOS UEFI GRUB configuration

# 1. Set root to ISO volume before accessing any themes or fonts
if [ -n "${ARCHISO_HINT}" ]; then
    set root="${ARCHISO_HINT}"
else
    search --no-floppy --set=root --label HIGANVEINOS_202609
fi

set prefix="(${root})/boot/grub"

# 2. Graphics and Theme initialization
set gfxmode=auto
set gfxpayload=keep
insmod all_video
insmod png
insmod jpeg
insmod font
insmod gfxterm
insmod gfxmenu

if loadfont "${prefix}/themes/higan/dejavu_14.pf2" ; then
    loadfont "${prefix}/themes/higan/dejavu_bold_14.pf2"
    set gfxmode="auto"
    terminal_output gfxterm
fi

set theme="${prefix}/themes/higan/theme.txt"
export theme

set menu_color_normal=light-gray/black
set menu_color_highlight=white/red

# 3. Platform detection
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

default=higanvein
timeout=15
timeout_style=menu

# 4. Boot Entries
menuentry "HiganveinOS Live (${archiso_platform} / CachyOS Kernel)" --class arch --class gnu-linux --class gnu --class os --id 'higanvein' {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=arch archisolabel=HIGANVEINOS_202609 quiet splash
    initrd /arch/boot/x86_64/initramfs-linux-cachyos.img
}

menuentry "HiganveinOS Live (Safe Graphics / Nomodeset)" --class arch --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=arch archisolabel=HIGANVEINOS_202609 nomodeset
    initrd /arch/boot/x86_64/initramfs-linux-cachyos.img
}

if [ "${grub_platform}" == 'efi' -a "${grub_cpu}" == 'x86_64' -a -f '/boot/memtest86+/memtest.efi' ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest.efi
    }
fi

if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' -a -f '/shellx64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellx64.efi
        }
    fi

    menuentry 'UEFI Firmware Settings' --class efi {
        fwsetup
    }
fi

menuentry "Reboot System" --class reboot {
    reboot
}

menuentry "Power Off" --class shutdown {
    halt
}
