# HiganveinOS UEFI GRUB configuration (efiboot)

# 1. Set root to ISO volume before accessing any themes or fonts
if [ -n "${ARCHISO_HINT}" ]; then
    set root="${ARCHISO_HINT}"
else
    search --no-floppy --set=root --label HIGANVEINOS_202609
fi

set prefix="(${root})/boot/grub"

# 2. Graphics and Theme initialization
set gfxmode=auto
set gfxpayload=keep
insmod all_video
insmod png
insmod jpeg
insmod font
insmod gfxterm
insmod gfxmenu

if loadfont "${prefix}/themes/higan/dejavu_14.pf2" ; then
    loadfont "${prefix}/themes/higan/dejavu_bold_14.pf2"
    set gfxmode="auto"
    terminal_output gfxterm
fi

set theme="${prefix}/themes/higan/theme.txt"
export theme

set menu_color_normal=light-gray/black
set menu_color_highlight=white/red

# 3. Boot Entries
menuentry "HiganveinOS Live (UEFI / CachyOS Kernel)" --class arch --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=arch archisolabel=HIGANVEINOS_202609 quiet splash
    initrd /arch/boot/x86_64/initramfs-linux-cachyos.img
}

menuentry "HiganveinOS Live (Safe Graphics / Nomodeset)" --class arch --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=arch archisolabel=HIGANVEINOS_202609 nomodeset
    initrd /arch/boot/x86_64/initramfs-linux-cachyos.img
}

menuentry "UEFI Firmware Settings" --class efi {
    fwsetup
}

menuentry "Reboot System" --class reboot {
    reboot
}

menuentry "Power Off" --class shutdown {
    halt
}
