<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Kaneki Iconic Crimson Red (Kakugan) -->
    <radialGradient id="kakuganGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="60%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    
    <!-- Monochrome Dark Gradient -->
    <linearGradient id="monoDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <filter id="bloodGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="500" height="500" rx="110" fill="url(#monoDark)" stroke="#27272a" stroke-width="4" />

  <!-- Background Monochrome Crosshatch / Shading -->
  <g stroke="#27272a" stroke-width="2" opacity="0.6">
    <line x1="80" y1="80" x2="420" y2="420" />
    <line x1="420" y1="80" x2="80" y2="420" />
    <circle cx="250" cy="250" r="170" fill="none" stroke-dasharray="10 10" />
  </g>

  <!-- Kaneki Ken Theme: The Zipper Mask & One-Eyed Kakugan Motif -->
  <g transform="translate(250, 250)">
    <!-- Stylized Mask Silhouette / High-contrast monochrome plates -->
    <path d="M-90,-120 L90,-120 L130,-20 L90,130 L-90,130 L-130,-20 Z" fill="#09090b" stroke="#71717a" stroke-width="6" stroke-linejoin="round" />
    
    <!-- Mask Zipper / Center Seam -->
    <line x1="0" y1="-120" x2="0" y2="130" stroke="#a1a1aa" stroke-width="5" stroke-dasharray="8 6" />

    <!-- Left Normal Eye (Dark/Monochrome) -->
    <circle cx="-50" cy="-20" r="18" fill="#18181b" stroke="#52525b" stroke-width="4" />
    <circle cx="-50" cy="-20" r="6" fill="#71717a" />

    <!-- Right Kakugan Eye (Iconic Piercing Red) -->
    <g filter="url(#bloodGlow)">
      <circle cx="50" cy="-20" r="26" fill="url(#kakuganGlow)" />
      <circle cx="50" cy="-20" r="10" fill="#fca5a5" />
      <circle cx="50" cy="-20" r="4" fill="#ffffff" />
    </g>

    <!-- Centipede / Finger Cracking Gestural Lines at bottom -->
    <path d="M-60,70 Q0,110 60,70" fill="none" stroke="#a1a1aa" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
