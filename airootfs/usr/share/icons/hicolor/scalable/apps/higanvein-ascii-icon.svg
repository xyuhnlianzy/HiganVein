<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="voidGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="70%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#040405"/>
    </radialGradient>

    <!-- Neon Crimson Gradient -->
    <linearGradient id="higanRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Void Background -->
  <circle cx="256" cy="256" r="240" fill="url(#voidGlow)" stroke="#27272a" stroke-width="6"/>

  <!-- Subtle Outer Sacred Tech Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-opacity="0.3" stroke-dasharray="8,6"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="#ef4444" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Left Twin Outer Torii/Tower Pillars from ASCII ($1 O |) -->
  <!-- Left Orb -->
  <circle cx="112" cy="110" r="14" fill="#ffffff" filter="url(#crimsonGlow)"/>
  <circle cx="112" cy="110" r="8" fill="#ef4444"/>
  <!-- Left Pillar -->
  <line x1="112" y1="130" x2="112" y2="400" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>

  <!-- Right Twin Outer Torii/Tower Pillars from ASCII ($1 O |) -->
  <!-- Right Orb -->
  <circle cx="400" cy="110" r="14" fill="#ffffff" filter="url(#crimsonGlow)"/>
  <circle cx="400" cy="110" r="8" fill="#ef4444"/>
  <!-- Right Pillar -->
  <line x1="400" y1="130" x2="400" y2="400" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>

  <!-- Side Whisker Flares from ASCII (*o* /* \|) -->
  <!-- Left Flairs -->
  <line x1="48" y1="270" x2="112" y2="350" stroke="#ef4444" stroke-width="7" stroke-linecap="round" stroke-opacity="0.85"/>
  <circle cx="48" cy="265" r="7" fill="#ffffff"/>
  <line x1="70" y1="190" x2="112" y2="240" stroke="#ef4444" stroke-width="6" stroke-linecap="round" stroke-opacity="0.7"/>
  <circle cx="70" cy="186" r="5" fill="#ef4444"/>

  <!-- Right Flairs -->
  <line x1="464" y1="270" x2="400" y2="350" stroke="#ef4444" stroke-width="7" stroke-linecap="round" stroke-opacity="0.85"/>
  <circle cx="464" cy="265" r="7" fill="#ffffff"/>
  <line x1="442" y1="190" x2="400" y2="240" stroke="#ef4444" stroke-width="6" stroke-linecap="round" stroke-opacity="0.7"/>
  <circle cx="442" cy="186" r="5" fill="#ef4444"/>

  <!-- Central Stepped Arch Chevron Apex (ASCII: /\ //\\ // \\) -->
  <!-- Outer Arch Canopy -->
  <path d="M 256 70 L 112 396 L 160 396 L 256 180 L 352 396 L 400 396 Z" fill="url(#higanRed)" filter="url(#crimsonGlow)"/>

  <!-- Inner Split Hollow (The Dual Spine: // \\) -->
  <path d="M 256 210 L 195 350 L 225 350 L 256 280 L 287 350 L 317 350 Z" fill="#09090b" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Base Intersecting Crossbeams -->
  <line x1="112" y1="396" x2="400" y2="396" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="90" y1="416" x2="422" y2="416" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Center Core Core Spark -->
  <circle cx="256" cy="150" r="6" fill="#ffffff" filter="url(#crimsonGlow)"/>
</svg>
